const byId=new Map(CARDS.map(c=>[c.id,c]));const KEY='boo-haunted-collection-v1';let state={owned:{},opened:0};try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object'){state={owned:v.owned||{},opened:Number(v.opened)||0}}}catch(e){}let tab='home',filter='all',run=null,drag=null;
const el=id=>document.getElementById(id),nOwned=()=>CARDS.filter(c=>(state.owned[c.id]||0)>0).length,nTotal=()=>Object.values(state.owned).reduce((a,b)=>a+(Number(b)||0),0),pct=()=>Math.round(nOwned()/36*100);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Storage is unavailable: collection may not be saved')}}
function toast(t){const e=el('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),2400)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cardHTML(c,opt={}){if(c.premiumArt){const owned=state.owned[c.id]||0,missing=opt.binder&&!owned,tag=opt.static?'div':'button';return `<${tag} class="card-preview premium-card ${c.rarity.toLowerCase().replace(' ','-')}${missing?' missing':''}" ${opt.static?'':`data-action="detail" data-id="${c.id}"`} aria-label="${esc(c.name)} #${c.number}, ${esc(c.rarity)}"><img src="${c.art}" alt="${esc(c.name)} illustrated collectible card" loading="lazy" decoding="async">${opt.binder&&owned>0?`<span class="owned-pill">×${owned}</span>`:''}${missing?'<span class="missing-overlay">?</span>':''}</${tag}>`;}let owned=state.owned[c.id]||0,missing=opt.binder&&owned===0,cl=c.rarity.toLowerCase().replace(' ','-'),num=`#${c.number}`;return `<${opt.static?'div':'button'} class="card-preview ${cl}${missing?' missing':''}" aria-label="${esc(c.name)} ${esc(c.rarity)} card" ${opt.static?'':`data-action="detail" data-id="${c.id}"`} title="${esc(c.name)}"><div class="card-head"><strong>${esc(c.name)}</strong><span class="card-number">${num}</span></div><div class="art-frame"><img src="${c.art}" alt="" loading="lazy"></div><div class="type-strap">${c.type} · ${c.rarity}</div><div class="card-description"><strong>${esc(c.ability)}</strong><p>${esc(c.flavour)}</p></div><div class="card-footer"><span>✦ ${c.type==='Ghost'?`HP ${c.hp}`:'HAUNT'}</span><span>BOO! 01</span></div>${opt.binder&&owned>0?`<div class="owned-pill">×${owned}</div>`:''}${missing?'<div class="missing-overlay">?</div>':''}</${opt.static?'div':'button'}>`}
function render(){el('nav-home').classList.toggle('active',tab==='home');el('nav-binder').classList.toggle('active',tab==='binder');el('nav-odds').classList.toggle('active',tab==='odds');el('top-count').innerHTML=`👻 ${nOwned()} / 36`;
 if(tab==='home'){el('view').className='shell home';el('view').innerHTML=`<section class="hero"><div class="hero-copy"><span class="pill">✦ SERIES 01 · THE MIDNIGHT MANOR</span><h1>Little ghosts.<br><span>Big surprises.</span></h1><p>Rip open a retro Halloween mystery pack, uncover adorable ghosts inspired by real spooky stories and fill your very own haunted collection.</p><div class="action-row"><button class="primary" data-action="open">🎃 RIP A FREE PACK ↗</button><button class="secondary" data-action="tab" data-tab="binder">View my binder →</button></div><p class="fine">Six cards per pack · One Rare or better guaranteed · Free playtest, no payments</p></div><div class="pack-area"><div class="orbit"><span>✦</span><span>☾</span><span>✧</span><span>✦</span></div><button class="pack-show" data-action="open" aria-label="Rip a Midnight Manor pack"><img src="${EMBEDDED_ART['pack-front.webp']}" alt="BOO! Midnight Manor digital booster pack"/></button></div></section><section class="stats"><div class="stat"><strong>${nOwned()}<small> / 36</small></strong><span>Unique discovered</span></div><div class="stat"><strong>${state.opened}</strong><span>Packs ripped</span></div><div class="stat"><strong>${pct()}%</strong><span>Binder complete</span></div></section><div class="section-head"><div><div class="eyebrow">THE COLLECTION</div><h2>Who will you haunt?</h2></div><button class="secondary" data-action="tab" data-tab="binder">All 36 cards →</button></div><section class="card-grid">${[1,2,15,18,19].map(id=>cardHTML(byId.get(id))).join('')}</section><section class="info-columns"><div class="panel"><div class="kicker">BEHIND EVERY BOO...</div><h3>Real ghost stories. Original characters.</h3><p>Meet Lady Lottie, inspired by a Tamworth Castle legend, or Marchy, inspired by York’s phantom Roman soldiers. Each ghost has a cheeky personality and an eerie origin to discover.</p></div><div class="panel"><div class="kicker">THE PACK PROMISE</div><h3>Every rip has a surprise.</h3><p>Three Common, two Uncommon and one Rare-or-better card. Chase holographic-style Ultra Rares and the elusive Secret Rare Manor Gates. Transparent pack odds; no spending required.</p></div></section>`}
 else if(tab==='binder'){el('view').className='shell binder-page';let lists=CARDS.filter(c=>filter==='all'||(filter==='owned'?(state.owned[c.id]||0)>0:filter==='missing'?(state.owned[c.id]||0)===0:filter===c.type.toLowerCase()));el('view').innerHTML=`<div class="page-top"><span class="eyebrow">YOUR PERSONAL COLLECTION</span><h1>The Haunted Binder</h1><p>Every ghost has a tale. Discover all 36 cards, find their legends and collect the ones you're missing. Your collection is saved locally on this device.</p></div><div class="stats"><div class="stat"><strong>${nOwned()} / 36</strong><span>Unique cards</span></div><div class="stat"><strong>${nTotal()}</strong><span>Total pulls</span></div><div class="stat"><strong>${state.opened}</strong><span>Packs opened</span></div></div><div class="progress-outer"><div class="progress-inner" style="width:${pct()}%"></div></div><div class="filters">${[['all','All 36'],['owned','Owned'],['missing','Missing'],['ghost','Ghosts'],['trick','Tricks'],['location','Locations']].map(([a,b])=>`<button data-action="filter" data-filter="${a}" class="${filter===a?'active':''}">${b}</button>`).join('')}</div>${lists.length?`<div class="card-grid">${lists.map(c=>cardHTML(c,{binder:true})).join('')}</div>`:`<div class="empty"><div class="ghost">👻</div><h3>Nothing haunting here yet.</h3><p>Rip a pack to add cards to your binder!</p><button class="primary" data-action="open">Rip a free pack</button></div>`}`}
 else{el('view').className='shell odds-page';el('view').innerHTML=`<div class="page-top"><span class="eyebrow">NO TRICKS WITH THE NUMBERS</span><h1>Pack odds & rules</h1><p>Every pack is a free digital playtest pack containing six cards. Here is exactly how the random draw works.</p></div><div class="odds-layout"><section class="panel"><div class="kicker">THE SIX-CARD RECIPE</div><h2>What's inside?</h2><ul class="how-list"><li>3 random <b>Common</b> cards</li><li>2 random <b>Uncommon</b> cards</li><li>1 card guaranteed <b>Rare or better</b></li></ul><div class="kicker" style="margin-top:25px">THE GUARANTEED SLOT</div>${[['Rare',89],['Ultra Rare',10],['Secret Rare',1]].map(([a,b])=>`<div class="odds-row"><b>${a}</b><div class="odds-meter"><span style="width:${b}%"></span></div><em>${b}%</em></div>`).join('')}<p class="fine">Each opening independently rolls for the final slot. Multiple copies of a card can be owned; the six cards in a pack are different. Odds are configured for this prototype, not verified manufacturing odds.</p></section><section class="panel"><div class="kicker">THE FIRST COLLECTION</div><h2>36 cards to find</h2><p>👻 21 Ghosts<br>🎃 7 Tricks<br>🏰 8 Haunted Locations</p><hr style="border:0;border-top:1px solid #64465c;margin:23px 0"><div class="badge-row"><span class="badge common">14 Common</span><span class="badge uncommon">10 Uncommon</span><span class="badge rare">8 Rare</span><span class="badge ultra">3 Ultra Rare</span><span class="badge secret">1 Secret Rare</span></div><p style="line-height:1.7;font-size:13px;margin-top:22px;color:#d8bfc4">BOO! is currently a free, browser-based collection prototype. Cards are fictional digital items. There is no real-money purchase, withdrawal, resale, ownership transfer or guaranteed future physical card.</p><button class="primary" data-action="open" style="margin-top:15px">Try a free pack →</button></section></div>`}
}
function pool(rarity,already){let cs=CARDS.filter(c=>c.rarity===rarity&&!already.includes(c.id));return cs.length?cs:CARDS.filter(c=>c.rarity===rarity)}
function randomCard(r,already){const p=pool(r,already);return p[Math.floor(Math.random()*p.length)]}
function makePack(){const before={...state.owned};const chosen=[],rarities=['Common','Common','Common','Uncommon','Uncommon'];const roll=Math.random()*100;rarities.push(roll<1?'Secret Rare':roll<11?'Ultra Rare':'Rare');for(const rarity of rarities){const c=randomCard(rarity,chosen.map(x=>x.id));chosen.push(c)};let cards=chosen.map(c=>({...c,newPull:!(before[c.id]>0)}));for(const c of cards)state.owned[c.id]=(state.owned[c.id]||0)+1;state.opened++;save();render();return cards}
function root(html){el('modal-root').innerHTML=`<div class="overlay"><div class="overlay-content" role="dialog" aria-modal="true" aria-label="BOO! pack opening"><button class="close" data-action="close" aria-label="Close dialog">×</button>${html}</div></div>`;document.body.style.overflow='hidden'}
function close(){el('modal-root').innerHTML='';document.body.style.overflow='';run=null;drag=null;render()}
function open(){run={stage:'sealed',cards:null,index:0,flipped:false,swipe:0};drawRun()}
function drawRun(){if(!run)return;
 if(run.stage==='sealed'||run.stage==='opening')root(`<div class="eyebrow">THE MIDNIGHT MANOR</div><h2 class="overlay-title">Time for a little mischief.</h2><div class="rip-pack-wrap ${run.stage==='opening'?'opened':''}" id="rip-pack"><img src="${EMBEDDED_ART['pack-front.webp']}" alt="BOO! Midnight Manor booster packet"><div class="tear-guide" id="tear" role="button" tabindex="0" aria-label="Swipe here or press Enter to tear open"><span>✂ SWIPE TO TEAR ↠</span></div></div><div class="swipe-progress"><div id="swipe-bar" style="width:${run.swipe}%"></div></div><p class="reveal-hint">Swipe across the seal, or tap the button below.</p><button class="primary" data-action="tear">Tear open my pack ✦</button><p class="fine" style="margin-top:21px">6 free digital cards · Rare or better guaranteed</p>`);
 else if(run.stage==='cards'){const c=run.cards[run.index],flipped=run.flipped;root(`<div class="kicker">THE REVEAL · ${run.index+1} OF 6</div><div class="reveal-card ${flipped?'flipped':''}" data-action="flip" role="button" tabindex="0" aria-label="${flipped?'View card details':'Flip to reveal card'}"><div class="flip-inner"><div class="flip-back"><span>BOO!</span></div><div class="flip-front">${cardHTML(c,{static:true})}</div></div></div>${flipped?`<div class="badge-row" style="justify-content:center"><span class="badge ${c.rarity.toLowerCase().replace(' ','-')}">${c.rarity==='Secret Rare'?'✦ ':''}${c.rarity}</span>${c.newPull?'<span class="badge uncommon">NEW!</span>':'<span class="badge">DUPLICATE</span>'}</div><h2 class="reveal-name">${esc(c.name)}</h2><p class="reveal-hint">${esc(c.place)}</p><button class="primary" data-action="next" style="margin-top:15px">${run.index===5?'VIEW ALL 6 PULLS ✦':'NEXT CARD →'}</button>`:`<h2 class="reveal-name">A mystery awaits...</h2><p class="reveal-hint">Tap the card to flip it over</p><button class="secondary" data-action="flip" style="margin-top:14px">Reveal card ✦</button>`}${flipped&&['Ultra Rare','Secret Rare'].includes(c.rarity)?confetti():''}`);}
 else if(run.stage==='summary'){const newCount=run.cards.filter(c=>c.newPull).length;root(`<div class="eyebrow">PACK COMPLETE ✦</div><h2 class="overlay-title">What a haunting haul!</h2><p class="reveal-hint">${newCount?`You discovered ${newCount} new card${newCount!==1?'s':''}!`:'All duplicates this time. Your ghosts are getting friendly!'}</p><div class="summary-grid">${run.cards.map(c=>`<div style="position:relative">${cardHTML(c)}${c.newPull?'<span class="new-flag">NEW</span>':''}</div>`).join('')}</div><div class="action-row" style="justify-content:center"><button class="primary" data-action="again">🎃 RIP ANOTHER</button><button class="secondary" data-action="binder">My binder →</button></div><p class="fine">All six cards are saved in your collection on this device.</p>`)}
}
function confetti(){return `<div class="confetti" aria-hidden="true">${Array.from({length:25},(_,i)=>`<b style="--left:${(i*37+11)%100}%;--size:${12+(i%4)*8}px;--speed:${1.7+(i%4)*.3}s;--delay:${(i%7)*.13}s">${i%3===0?'✦':i%3===1?'★':'✧'}</b>`).join('')}</div>`}
function tear(){if(!run||run.stage!=='sealed')return;run.stage='opening';run.cards=makePack();drawRun();setTimeout(()=>{if(run&&run.stage==='opening'){run.stage='cards';run.index=0;run.flipped=false;drawRun()}},680)}
function next(){if(!run||run.stage!=='cards')return;if(!run.flipped){run.flipped=true;drawRun();return}if(run.index===5){run.stage='summary';drawRun()}else{run.index++;run.flipped=false;drawRun()}}
function detail(id){const c=byId.get(id);if(!c)return;const owned=state.owned[c.id]||0;root(`<div class="detail-grid"><div>${cardHTML(c)}</div><div class="detail-copy"><span class="badge ${c.rarity.toLowerCase().replace(' ','-')}">${c.rarity}</span> <span class="badge">${c.type}</span><h2>${esc(c.name)}</h2><p><em>“${esc(c.flavour)}”</em></p><div class="lore-note"><span class="eyebrow">BEHIND THE BOO!</span><p>${esc(c.lore)}</p><p class="subtle" style="font-size:12px">📍 ${esc(c.place)}</p></div><p><b>Signature move:</b> ${esc(c.ability)}${c.hp?` · ${c.hp} HP`:''}</p><p><b>In your binder:</b> ${owned?`${owned} ${owned===1?'copy':'copies'}`:'Not discovered yet'}</p><button class="secondary" data-action="close" style="margin-top:10px">Back to collection</button></div></div>`)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;if(a==='tab'){tab=t.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'})}else if(a==='open'){open()}else if(a==='tear'){tear()}else if(a==='flip'){next()}else if(a==='next'){next()}else if(a==='again'){open()}else if(a==='binder'){close();tab='binder';render();window.scrollTo({top:0,behavior:'smooth'})}else if(a==='close'){close()}else if(a==='filter'){filter=t.dataset.filter;render()}else if(a==='detail'){detail(Number(t.dataset.id))}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#tear')&&run?.stage==='sealed'){drag={x:e.clientX};try{e.target.setPointerCapture(e.pointerId)}catch(err){}}});document.addEventListener('pointermove',e=>{if(!drag||!run||run.stage!=='sealed')return;let w=Math.max(80,el('tear')?.getBoundingClientRect().width||200);run.swipe=Math.min(100,Math.max(0,(e.clientX-drag.x)/w*125));const b=el('swipe-bar');if(b)b.style.width=run.swipe+'%';if(run.swipe>80){drag=null;tear()}});document.addEventListener('pointerup',()=>{if(drag){drag=null;if(run&&run.stage==='sealed'){run.swipe=0;const b=el('swipe-bar');if(b)b.style.width='0%'}}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='tear'){e.preventDefault();tear()}else if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('reveal-card')){e.preventDefault();next()}else if(e.key==='Escape'&&el('modal-root').innerHTML){close()}});
render();
})();
</script>
</body>
